<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products | Chenxin Admin</title><link rel="stylesheet" href="../assets/css/style.css"></head><body class="admin-body"><aside class="sidebar"><div class="sidebrand"><img src="../assets/images/logo.jpeg"><b>CHENXIN<br>ADMIN</b></div><a href="index.html">▦ Dashboard</a><a class="active" href="products.html">▣ Products</a><a href="orders.html">▤ Orders</a><a href="../index.html">↗ View Store</a></aside><main class="admin-main"><header class="admin-top"><div><span class="eyebrow">Catalogue</span><h1>Product management</h1></div></header><section class="admin-card"><h2 id="formTitle">Add product</h2><form id="productForm" class="product-form"><input type="hidden" id="editId"><label>Product name<input id="name" required placeholder="e.g. Premium Oil Filter"></label><label>Product code / SKU<input id="sku" placeholder="e.g. CX-1001"></label><label>Category<select id="category"><option>Oil Filters</option><option>Air Filters</option><option>Fuel Filters</option><option>Cabin Filters</option><option>Hydraulic Filters</option><option>Truck Filters</option><option>Accessories</option></select></label><label>Price (USD)<input id="price" type="number" min="0" step="0.01" required></label><label>Stock quantity<input id="stock" type="number" min="0" required></label><label>Image URL<input id="image" placeholder="Optional image link"></label><label class="full">Description<textarea id="description" rows="2" placeholder="Product description"></textarea></label><div class="form-actions"><button class="btn" type="submit">Save product</button><button class="btn btn-light" type="button" onclick="resetForm()">Clear</button></div></form></section><section class="admin-card"><div class="section-head"><h2>Products</h2><input id="productSearch" placeholder="Search products…" oninput="renderAdminProducts()"></div><div id="productTable"></div></section></main><script src="../assets/js/admin.js"></script></body></html>
